
services:

  database:
    image: postgres:16-alpine
    container_name: clinical_postgres

    environment:
      POSTGRES_DB: clinical_evidence
      POSTGRES_USER: clinical_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinical_user -d clinical_evidence"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile

    container_name: clinical_backend

    environment:
      APP_ENV: production
      DEBUG: "false"

      DATABASE_URL: postgresql+psycopg://clinical_user:${POSTGRES_PASSWORD:-change-this-password}@database:5432/clinical_evidence

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}

      SECRET_KEY: ${SECRET_KEY:-change-this-secret-before-deployment}

      CHROMA_PERSIST_DIRECTORY: /app/data/chroma_db

      CORS_ORIGINS: http://localhost:5173,http://localhost:8080

    ports:
      - "8000:8000"

    volumes:
      - ../data:/app/data
      - ../logs:/app/logs

    depends_on:
      database:
        condition: service_healthy

    restart: unless-stopped


  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: http://localhost:8000

    container_name: clinical_frontend

    ports:
      - "8080:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  postgres_data:
